<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="58%" stop-color="#061426"/>
      <stop offset="100%" stop-color="#020711"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a2f"/>
      <stop offset="100%" stop-color="#03101f"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#050b16"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: DejaVu Sans; font-weight: 800; fill: #f8fafc; }
      .yellow { fill: #ffd21f; }
      .muted { fill: #9fb4cf; }
      .text { font-family: DejaVu Sans; fill: #e8f0ff; }
      .small { font-size: 22px; font-weight: 600; }
      .tiny { font-size: 18px; font-weight: 600; }
      .panel-title { font-size: 35px; font-weight: 800; fill: #ffd21f; }
      .code-text { font-family: DejaVu Sans Mono; font-size: 18px; fill: #dce8ff; }
      .code-dim { font-family: DejaVu Sans Mono; font-size: 18px; fill: #8da5c8; }
      .code-cyan { font-family: DejaVu Sans Mono; font-size: 18px; fill: #45e3d2; }
      .code-yellow { font-family: DejaVu Sans Mono; font-size: 18px; fill: #ffd21f; }
      .code-red { font-family: DejaVu Sans Mono; font-size: 18px; fill: #ff6b6b; }
      .badge-text { font-family: DejaVu Sans; font-size: 32px; font-weight: 900; fill: #04111f; }
      .label { font-family: DejaVu Sans; font-size: 19px; font-weight: 800; fill: #e8f0ff; }
      .caption { font-family: DejaVu Sans; font-size: 20px; font-weight: 700; fill: #b9c8dd; }
      .chip { font-family: DejaVu Sans; font-size: 19px; font-weight: 800; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="940" cy="120" r="150" fill="#0d3155" opacity="0.25"/>
  <circle cx="120" cy="980" r="190" fill="#123a2f" opacity="0.18"/>

  <!-- Header -->
  <rect x="36" y="34" width="118" height="118" rx="12" fill="#ffd21f"/>
  <text x="95" y="114" text-anchor="middle" class="title" font-size="62" fill="#04111f">JS</text>
  <text x="178" y="74" class="title" font-size="42">JavaScript Behind The Scenes</text>
  <text x="178" y="124" class="title" font-size="56" fill="#ffd21f">Callback Hell</text>
  <text x="180" y="158" class="text small" fill="#9fb4cf">Inversion of Control &amp; trust issues</text>
  <text x="936" y="94" text-anchor="middle" class="title" font-size="34" fill="#ffd21f">Day 14</text>

  <!-- Panel 1 -->
  <rect x="34" y="186" width="507" height="288" rx="12" fill="url(#panel)" stroke="#1f558d" stroke-width="2"/>
  <rect x="58" y="211" width="48" height="48" rx="9" fill="#ffd21f"/>
  <text x="82" y="245" text-anchor="middle" class="badge-text">1</text>
  <text x="122" y="246" class="panel-title" fill="#ffd21f">Pyramid of Doom</text>
  <text x="61" y="281" class="caption">Nested callbacks push code deeper</text>

  <rect x="61" y="299" width="456" height="152" rx="10" fill="url(#code)" stroke="#31445f" stroke-width="2"/>
  <text x="82" y="323" class="code-cyan">api.createOrder(cart, function () {</text>
  <text x="106" y="345" class="code-yellow">api.proceedToPayment(function () {</text>
  <text x="130" y="367" class="code-red">api.showOrderSummary(function () {</text>
  <text x="154" y="389" class="code-cyan">api.updateWallet();</text>
  <text x="130" y="411" class="code-dim">});</text>
  <text x="106" y="433" class="code-dim">});</text>
  <text x="82" y="455" class="code-dim">});</text>

  <text x="75" y="470" class="tiny" fill="#ffd21f">Deep nesting = hard to read, debug, and maintain</text>

  <!-- Panel 2 -->
  <rect x="559" y="186" width="487" height="288" rx="12" fill="url(#panel)" stroke="#1f558d" stroke-width="2"/>
  <rect x="584" y="211" width="48" height="48" rx="9" fill="#ffd21f"/>
  <text x="608" y="245" text-anchor="middle" class="badge-text">2</text>
  <text x="648" y="246" class="panel-title" fill="#ffd21f">Inversion of Control</text>
  <text x="587" y="281" class="caption">We trust another API to run cb</text>

  <rect x="587" y="305" width="420" height="60" rx="10" fill="url(#code)" stroke="#31445f" stroke-width="2"/>
  <text x="611" y="343" class="code-cyan">api.createOrder(cart, cb)</text>
  <path d="M795 370 C795 394 760 403 741 418" fill="none" stroke="#45e3d2" stroke-width="4" stroke-linecap="round"/>
  <polygon points="735,422 750,407 754,425" fill="#45e3d2"/>
  <circle cx="695" cy="425" r="40" fill="#071f36" stroke="#45e3d2" stroke-width="3"/>
  <text x="695" y="439" text-anchor="middle" class="title yellow" font-size="48">cb</text>

  <rect x="817" y="391" width="154" height="38" rx="19" fill="#182238" stroke="#ff6b6b" stroke-width="2"/>
  <text x="894" y="416" text-anchor="middle" class="chip">never calls?</text>
  <rect x="586" y="391" width="142" height="38" rx="19" fill="#182238" stroke="#ffd21f" stroke-width="2"/>
  <text x="657" y="416" text-anchor="middle" class="chip">calls twice?</text>
  <rect x="584" y="438" width="138" height="38" rx="19" fill="#182238" stroke="#7c5cff" stroke-width="2"/>
  <text x="653" y="463" text-anchor="middle" class="chip">too early?</text>
  <rect x="805" y="438" width="132" height="38" rx="19" fill="#182238" stroke="#2ea8ff" stroke-width="2"/>
  <text x="871" y="463" text-anchor="middle" class="chip">too late?</text>

  <!-- Panel 3 -->
  <rect x="34" y="494" width="1012" height="278" rx="12" fill="url(#panel)" stroke="#1f558d" stroke-width="2"/>
  <rect x="58" y="519" width="48" height="48" rx="9" fill="#ffd21f"/>
  <text x="82" y="553" text-anchor="middle" class="badge-text">3</text>
  <text x="122" y="553" class="panel-title" fill="#ffd21f">Behind The Scenes Flow</text>

  <g transform="translate(76 594)">
    <rect x="0" y="0" width="147" height="84" rx="10" fill="#071c32" stroke="#2e6dff" stroke-width="3"/>
    <text x="73" y="35" text-anchor="middle" class="label">Callback</text>
    <text x="73" y="60" text-anchor="middle" class="caption" font-size="17">passed in</text>

    <path d="M161 42 H213" stroke="#ffd21f" stroke-width="4" stroke-linecap="round"/>
    <polygon points="213,42 199,34 199,50" fill="#ffd21f"/>

    <rect x="227" y="0" width="147" height="84" rx="10" fill="#071c32" stroke="#8b5cf6" stroke-width="3"/>
    <text x="300" y="35" text-anchor="middle" class="label">3rd Party</text>
    <text x="300" y="60" text-anchor="middle" class="caption" font-size="17">controls cb</text>

    <path d="M388 42 H440" stroke="#ffd21f" stroke-width="4" stroke-linecap="round"/>
    <polygon points="440,42 426,34 426,50" fill="#ffd21f"/>

    <rect x="454" y="0" width="147" height="84" rx="10" fill="#071c32" stroke="#45e3d2" stroke-width="3"/>
    <text x="527" y="35" text-anchor="middle" class="label">Callback</text>
    <text x="527" y="60" text-anchor="middle" class="caption" font-size="17">runs later</text>

    <path d="M615 42 H667" stroke="#ffd21f" stroke-width="4" stroke-linecap="round"/>
    <polygon points="667,42 653,34 653,50" fill="#ffd21f"/>

    <rect x="681" y="0" width="147" height="84" rx="10" fill="#071c32" stroke="#ff6b6b" stroke-width="3"/>
    <text x="754" y="35" text-anchor="middle" class="label">Risk</text>
    <text x="754" y="60" text-anchor="middle" class="caption" font-size="17">lost control</text>
  </g>

  <rect x="88" y="709" width="220" height="44" rx="10" fill="#061f24" stroke="#45e3d2" stroke-width="2"/>
  <text x="198" y="738" text-anchor="middle" class="caption" fill="#e8f0ff">Hard to track</text>
  <rect x="379" y="709" width="270" height="44" rx="10" fill="#1d162b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="514" y="738" text-anchor="middle" class="caption" fill="#e8f0ff">Errors get harder</text>
  <rect x="728" y="709" width="210" height="44" rx="10" fill="#231923" stroke="#ff6b6b" stroke-width="2"/>
  <text x="833" y="738" text-anchor="middle" class="caption" fill="#e8f0ff">Messy flow</text>

  <!-- Panel 4 -->
  <rect x="34" y="792" width="1012" height="144" rx="12" fill="url(#panel)" stroke="#1f558d" stroke-width="2"/>
  <rect x="58" y="822" width="48" height="48" rx="9" fill="#ffd21f"/>
  <text x="82" y="856" text-anchor="middle" class="badge-text">4</text>
  <text x="122" y="856" class="panel-title" fill="#ffd21f">Web3 Example</text>
  <text x="123" y="897" class="caption">Web3 async steps can become nested</text>

  <g transform="translate(524 820)">
    <rect x="0" y="0" width="113" height="66" rx="10" fill="#071c32" stroke="#2ea8ff" stroke-width="2"/>
    <text x="56" y="41" text-anchor="middle" class="label">Wallet</text>
    <path d="M125 33 H164" stroke="#45e3d2" stroke-width="3"/>
    <polygon points="164,33 153,27 153,39" fill="#45e3d2"/>
    <rect x="176" y="0" width="113" height="66" rx="10" fill="#071c32" stroke="#8b5cf6" stroke-width="2"/>
    <text x="232" y="41" text-anchor="middle" class="label">Tx Hash</text>
    <path d="M301 33 H340" stroke="#45e3d2" stroke-width="3"/>
    <polygon points="340,33 329,27 329,39" fill="#45e3d2"/>
    <rect x="352" y="0" width="128" height="66" rx="10" fill="#071c32" stroke="#ffd21f" stroke-width="2"/>
    <text x="416" y="41" text-anchor="middle" class="label">Confirm</text>
  </g>

  <!-- Takeaway -->
  <rect x="34" y="956" width="1012" height="58" rx="12" fill="#0b1424" stroke="#ffd21f" stroke-width="3"/>
  <circle cx="74" cy="985" r="22" fill="none" stroke="#ffd21f" stroke-width="3"/>
  <path d="M66 980 C66 970 82 970 82 980 C82 987 75 989 75 996 H73 C73 989 66 987 66 980Z" fill="#ffd21f"/>
  <text x="111" y="994" class="title" font-size="24" fill="#ffd21f">Key Takeaway:</text>
  <text x="326" y="994" class="title" font-size="20">Nested callbacks = Callback Hell. Passing cb = lost control.</text>
</svg>
